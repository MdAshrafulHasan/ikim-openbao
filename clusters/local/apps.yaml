apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: demo-db-check
  namespace: flux-system
spec:
  dependsOn:
    - name: external-secrets-stores
    - name: pg-cluster
  interval: 10m
  path: ./apps/demo-db-check
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system