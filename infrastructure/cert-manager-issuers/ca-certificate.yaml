apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: devops-challenge-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: devops-challenge-ca
  secretName: devops-challenge-ca-secret
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer