apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao-push-store
spec:
  provider:
    vault:
      server: "https://openbao.openbao.svc.cluster.local:8200"
      path: "kv-apps"
      version: "v2"
      caProvider:
        type: Secret
        name: openbao-ca
        namespace: external-secrets
        key: ca.crt
      auth:
        tokenSecretRef:
          name: openbao-push-token
          namespace: external-secrets
          key: token