apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: minio
spec:
  type: oci
  interval: 1h
  url: oci://registry-1.docker.io/bitnamicharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 10m
  chart:
    spec:
      chart: minio
      version: "14.10.5"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: minio
  install:
    createNamespace: true
  values:
    auth:
      rootUser: admin
      rootPassword: minioadmin123
    defaultBuckets: "postgres-backups"
    persistence:
      enabled: true
      size: 5Gi
    mode: standalone