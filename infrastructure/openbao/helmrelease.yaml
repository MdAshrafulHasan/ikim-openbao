apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 10m
  chart:
    spec:
      chart: openbao
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: openbao
  install:
    createNamespace: true
  values:
    global:
      tlsDisable: false
    server:
      affinity: ""
      standalone:
        enabled: false
      dataStorage:
        enabled: true
        size: 2Gi
      service:
        enabled: true
      extraEnvironmentVars:
        BAO_CACERT: /vault/userconfig/openbao-tls/ca.crt
      volumes:
        - name: userconfig-openbao-tls
          secret:
            defaultMode: 420
            secretName: openbao-tls
      volumeMounts:
        - mountPath: /vault/userconfig/openbao-tls
          name: userconfig-openbao-tls
          readOnly: true
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
          config: |
            ui = true

            listener "tcp" {
              address       = "[::]:8200"
              cluster_address = "[::]:8201"
              tls_cert_file = "/vault/userconfig/openbao-tls/tls.crt"
              tls_key_file  = "/vault/userconfig/openbao-tls/tls.key"
            }

            storage "raft" {
              path = "/openbao/data"
            }

            service_registration "kubernetes" {}