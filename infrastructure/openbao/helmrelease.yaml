apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 10m
  chart:
    spec:
      chart: openbao
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: openbao
  install:
    createNamespace: true
  values:
    server:
      ha:
        enabled: true
        replicas: 3
        raft:
          enabled: true
          setNodeId: true
      dataStorage:
        enabled: true
        size: 2Gi
      standalone:
        enabled: false
      service:
        enabled: true
      affinity: ""